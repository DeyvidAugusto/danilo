<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cuidar Bem - Catálogo de produtos de apoio e acessibilidade: cadeiras de rodas, andadores, auxiliares de higiene e itens para o dia a dia."
    />
    <title>Cuidar Bem | Produtos de Apoio e Acessibilidade</title>
    <script>
      ;(function () {
        var stored = null
        try {
          stored = window.localStorage.getItem('catalog-theme')
        } catch (e) {
          /* noop */
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
